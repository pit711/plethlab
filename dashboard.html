<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PlethLab Monitor</title>
<style>
/* Bedside-monitor look: dark surface, channel colours follow ICU convention
   (pulse green, SpO2/pleth cyan, respiration yellow). Intentionally dark only. */
:root {
  --bg: #000; --panel: #07090a; --line: #1a1f22; --ink: #e9ecee; --ink-2: #9aa3a8; --muted: #5f686d;
  --grid-minor: rgba(64, 200, 140, .10); --grid-major: rgba(64, 200, 140, .26);
  --hr: #3ddc84; --spo2: #22d3ee; --resp: #facc15; --hrv: #f472b6; --amp: #e5e7eb;
  --lf: #60a5fa; --hf: #f472b6;
  --warn: #fbbf24; --crit: #ef4444;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { font: 13px/1.35 "Segoe UI", system-ui, sans-serif; }
.num { font-variant-numeric: tabular-nums; }

header { display: flex; align-items: center; gap: 14px; padding: 6px 14px; border-bottom: 1px solid var(--line);
  background: #050607; flex-wrap: wrap; }
.brand { font-weight: 700; letter-spacing: .02em; }
.brand small { color: var(--ink-2); font-weight: 400; margin-left: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; color: var(--ink-2); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.spacer { flex: 1; }
.clock { font-size: 18px; font-weight: 600; }
.clock small { font-size: 12px; color: var(--ink-2); font-weight: 400; margin-left: 6px; }
button { font: inherit; color: var(--ink); background: #0d1113; border: 1px solid #2a3236; border-radius: 4px;
  padding: 3px 10px; cursor: pointer; }
button:hover { border-color: #46525a; }
button:disabled { opacity: .5; cursor: default; }
button[aria-pressed="true"] { background: var(--ink); color: #000; border-color: var(--ink); }
.sig { display: inline-flex; gap: 2px; align-items: flex-end; height: 14px; }
.sig span { width: 4px; background: #262c30; border-radius: 1px; }
.sig span.on { background: var(--spo2); }
.sim { background: #3b2f00; color: var(--warn); border-radius: 3px; padding: 0 6px; font-weight: 600; font-size: 11px; }

.inop { padding: 4px 14px; font-weight: 600; letter-spacing: .04em; color: #000; display: none; }
.inop.show { display: block; background: var(--warn); }

main { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 1px; background: var(--line); }
.col { background: var(--bg); display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.right { background: var(--panel); }
.right .panel + .panel { border-top: 1px solid var(--line); }

.ch { position: relative; background: var(--bg); padding: 4px 8px 6px; }
.ch-head { display: flex; gap: 12px; align-items: baseline; font-size: 12px; margin-bottom: 2px; flex-wrap: wrap; }
.ch-head b { font-weight: 600; }
.ch-head .meta { color: var(--muted); }
canvas { display: block; width: 100%; }
#pleth { height: 190px; }
#respc { height: 90px; }
#tacho { height: 130px; }

.cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1px; background: var(--line); }
.card { background: var(--bg); padding: 6px 8px 8px; min-width: 0; }
.card canvas { height: 200px; }
.kv { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px 8px; margin-top: 6px; }
.kv div { color: var(--ink-2); font-size: 11px; }
.kv b { display: block; color: var(--ink); font-size: 14px; font-weight: 600; }
.note { color: var(--muted); font-size: 11px; margin-top: 4px; }

.panel { background: var(--panel); padding: 8px 12px 10px; position: relative; }
.p-head { display: flex; justify-content: space-between; align-items: baseline; font-size: 12px; }
.p-head b { font-weight: 600; letter-spacing: .03em; }
.p-head .unit { color: var(--ink-2); }
.limits { position: absolute; right: 12px; top: 26px; text-align: right; font-size: 11px; line-height: 1.25; color: var(--ink-2); }
.big { font-weight: 600; line-height: 1; margin-top: 4px; }
.big.xl { font-size: 76px; }
.big.l { font-size: 52px; }
.big.m { font-size: 40px; }
.sub { color: var(--ink-2); font-size: 12px; margin-top: 4px; min-height: 16px; }
.rows { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 4px 10px; margin-top: 6px; }
.rows div { color: var(--ink-2); font-size: 11px; }
.rows b { display: block; color: var(--ink); font-size: 16px; font-weight: 600; }
.heart { display: inline-block; font-size: 26px; vertical-align: top; margin-left: 6px; transition: transform .08s, opacity .2s; opacity: .45; }
.heart.beat { transform: scale(1.35); opacity: 1; }
.alarm { font-weight: 700; font-size: 12px; letter-spacing: .05em; padding: 1px 6px; border-radius: 3px; display: none; }
.alarm.warn { display: inline-block; background: var(--warn); color: #000; }
.alarm.crit { display: inline-block; background: var(--crit); color: #fff; animation: blink 1s steps(2, start) infinite; }
@keyframes blink { to { visibility: hidden; } }
.panel.crit-bg { box-shadow: inset 0 0 0 2px var(--crit); }

.trend-head { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; padding: 6px 8px; background: var(--bg); }
.trend-head b { font-size: 12px; margin-right: 8px; }
.strip { position: relative; background: var(--bg); padding: 2px 8px; }
.strip canvas { height: 86px; }
.strip .lbl { position: absolute; right: 18px; top: 3px; font-size: 11px; pointer-events: none; background: rgba(0, 0, 0, .7); padding: 0 4px; }
.tip { position: fixed; pointer-events: none; background: #0d1113; border: 1px solid #3a444a; border-radius: 4px;
  padding: 6px 9px; font-size: 12px; display: none; z-index: 20; white-space: nowrap; }
.tip .row { display: flex; gap: 8px; justify-content: space-between; }
.tip i { display: inline-block; width: 10px; height: 3px; vertical-align: middle; margin-right: 5px; }

#tableWrap { display: none; max-height: 300px; overflow: auto; background: var(--bg); padding: 0 8px 8px; }
table { width: 100%; border-collapse: collapse; font-size: 12px; }
th, td { text-align: right; padding: 3px 8px; border-bottom: 1px solid var(--line); }
th:first-child, td:first-child { text-align: left; }
th { color: var(--ink-2); font-weight: 500; position: sticky; top: 0; background: var(--bg); }
footer { color: var(--muted); font-size: 11px; padding: 8px 14px; border-top: 1px solid var(--line); }

dialog { background: #0b0e10; color: var(--ink); border: 1px solid #2a3236; border-radius: 8px; padding: 0;
  width: min(760px, calc(100vw - 32px)); }
dialog::backdrop { background: rgba(0, 0, 0, .65); }
.dlg-head { display: flex; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--line); }
.dlg-head b { font-size: 14px; }
.dlg-body { padding: 12px 14px; }
.dlg-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
.msg { padding: 6px 10px; border-radius: 4px; margin: 8px 0; display: none; }
.msg.show { display: block; }
.msg.err { background: #3a1010; color: #fecaca; }
.msg.ok { background: #0f2a18; color: #bbf7d0; }
.msg.info { background: #11202b; color: #bae6fd; }
#recChart { height: 180px; margin-top: 8px; }

@media (max-width: 1100px) { .cards { grid-template-columns: 1fr 1fr; } }
@media (max-width: 1000px) {
  main { grid-template-columns: 1fr; }
  .right { display: grid; grid-template-columns: 1fr 1fr; }
  .right .panel + .panel { border-top: 0; }
  .big.xl { font-size: 56px; } .big.l { font-size: 40px; }
}
@media (max-width: 600px) {
  .right, .cards { grid-template-columns: 1fr; }
  #pleth { height: 150px; }
}
</style>
</head>
<body>
<header>
  <span class="brand">PlethLab <small data-i18n="subtitle"></small></span>
  <span class="sim" id="simChip" hidden>SIM</span>
  <span class="chip" id="userChip"></span>
  <span class="chip"><span class="dot" id="connDot"></span><span id="connText"></span></span>
  <span class="chip"><span data-i18n="signal"></span> <span class="sig" id="sig"></span></span>
  <span class="spacer"></span>
  <span class="clock num" id="clock">--:--:--</span>
  <span class="spacer"></span>
  <button id="deviceBtn" data-i18n="device"></button>
  <button id="tableBtn" aria-pressed="false" data-i18n="table"></button>
  <button id="csvBtn" data-i18n="csv"></button>
  <button id="langBtn" title="Language / Sprache">DE</button>
</header>
<div class="inop" id="inop" role="status"></div>

<main>
  <section class="col">
    <div class="ch">
      <div class="ch-head"><b style="color:var(--spo2)">Pleth</b><span class="meta" data-i18n="plethMeta"></span></div>
      <canvas id="pleth"></canvas>
    </div>
    <div class="ch">
      <div class="ch-head"><b style="color:var(--resp)" data-i18n="respWave"></b><span class="meta" data-i18n="respWaveMeta"></span></div>
      <canvas id="respc"></canvas>
    </div>
    <div class="ch">
      <div class="ch-head"><b style="color:var(--hr)" data-i18n="tacho"></b><span class="meta" data-i18n="tachoMeta"></span></div>
      <canvas id="tacho"></canvas>
    </div>
    <div class="cards">
      <div class="card">
        <div class="ch-head"><b style="color:var(--hrv)">Poincaré</b><span class="meta" data-i18n="poincareMeta"></span></div>
        <canvas id="poincare"></canvas>
        <div class="kv num"><div>SD1<b id="sd1">–</b></div><div>SD2<b id="sd2">–</b></div><div>SD2/SD1<b id="sdr">–</b></div></div>
      </div>
      <div class="card">
        <div class="ch-head"><b style="color:var(--hrv)" data-i18n="spectrum"></b><span class="meta" data-i18n="spectrumMeta"></span></div>
        <canvas id="psd"></canvas>
        <div class="kv num"><div>LF<b id="lf">–</b></div><div>HF<b id="hf">–</b></div><div>LF/HF<b id="lfhf">–</b></div></div>
        <div class="note" id="psdNote"></div>
      </div>
      <div class="card">
        <div class="ch-head"><b style="color:var(--spo2)" data-i18n="shape"></b><span class="meta" id="shapeMeta"></span></div>
        <canvas id="shape"></canvas>
        <div class="kv num"><div data-i18n-prefix="rise">–<b id="rise">–</b></div><div>b/a<b id="ba">–</b></div><div data-i18n-prefix="notch">–<b id="notch">–</b></div></div>
        <div class="note" data-i18n="shapeNote"></div>
      </div>
    </div>
    <div class="trend-head" role="group">
      <b data-i18n="trends"></b>
      <button data-range="300">5 min</button>
      <button data-range="1800" aria-pressed="true">30 min</button>
      <button data-range="7200">2 h</button>
      <button data-range="0" data-i18n="all"></button>
    </div>
    <div id="strips"></div>
    <div id="tableWrap">
      <table><thead><tr><th data-i18n="time"></th><th>SpO₂ %</th><th data-i18n="pulse"></th><th data-i18n="respPerMin"></th><th>RMSSD ms</th><th data-i18n="ampPct"></th></tr></thead>
      <tbody id="tbody"></tbody></table>
    </div>
  </section>

  <aside class="col right">
    <div class="panel" id="pHr">
      <div class="p-head"><b style="color:var(--hr)" data-i18n="pulseCaps"></b><span class="unit">bpm</span></div>
      <div class="limits num">120<br>50</div>
      <div class="big xl num" style="color:var(--hr)"><span id="hr">–</span><span class="heart" id="heart" style="color:var(--hr)">♥</span></div>
      <div class="sub"><span class="alarm" id="hrAlarm"></span> <span id="hrSub"></span></div>
    </div>
    <div class="panel" id="pSpo2">
      <div class="p-head"><b style="color:var(--spo2)">SpO₂</b><span class="unit">%</span></div>
      <div class="limits num">100<br>90</div>
      <div class="big xl num" style="color:var(--spo2)" id="spo2">–</div>
      <div class="sub"><span class="alarm" id="spo2Alarm"></span> <span id="spo2Sub"></span></div>
    </div>
    <div class="panel">
      <div class="p-head"><b style="color:var(--resp)" data-i18n="respCaps"></b><span class="unit">/min</span></div>
      <div class="big l num" style="color:var(--resp)" id="resp">–</div>
      <div class="sub" id="respSub"></div>
    </div>
    <div class="panel">
      <div class="p-head"><b style="color:var(--hrv)">HRV · RMSSD</b><span class="unit">ms</span></div>
      <div class="big m num" style="color:var(--hrv)" id="rmssd">–</div>
      <div class="rows num">
        <div>SDNN<b id="sdnn">–</b></div>
        <div>pNN50<b id="pnn50">–</b></div>
        <div data-i18n-prefix="meanHr">–<b id="hrMean">–</b></div>
      </div>
      <div class="sub" id="hrvSub"></div>
    </div>
    <div class="panel">
      <div class="p-head"><b style="color:var(--amp)" data-i18n="perfCaps"></b><span class="unit" data-i18n="relative"></span></div>
      <div class="rows num">
        <div data-i18n-prefix="amplitude">–<b id="amp">–</b></div>
        <div>PI<b id="pi">–</b></div>
        <div data-i18n-prefix="rhythm">–<b id="rhythm">–</b></div>
      </div>
      <div class="sub" data-i18n="ampSub"></div>
    </div>
  </aside>
</main>

<footer data-i18n="footer"></footer>
<div class="tip" id="tip"></div>

<dialog id="dlg">
  <div class="dlg-head"><b data-i18n="deviceTitle"></b><span class="spacer"></span><button id="dlgClose" data-i18n="close"></button></div>
  <div class="dlg-body">
    <div class="dlg-row">
      <button id="loadStorage" data-i18n="readStorage"></button>
      <button id="setClock" data-i18n="setClock"></button>
    </div>
    <div class="msg" id="dlgMsg"></div>
    <table id="segTable" hidden><thead><tr><th data-i18n="segment"></th><th data-i18n="start"></th><th data-i18n="duration"></th><th></th></tr></thead><tbody></tbody></table>
    <div id="recWrap" hidden>
      <canvas id="recChart"></canvas>
      <div class="kv num" id="recStats"></div>
      <div class="dlg-row" style="margin-top:8px"><a id="recCsv" href="#" style="color:var(--spo2)" data-i18n="downloadCsv"></a></div>
    </div>
  </div>
</dialog>

<script>
// ---------- i18n ----------
const I18N = {
  en: {
    subtitle: "pulse oximeter monitor", signal: "Signal", device: "Device", table: "Table", csv: "CSV",
    plethMeta: "pulse wave · 60 samples/s, drawn as a smooth curve · 6 s",
    respWave: "Resp (derived)", respWaveMeta: "respiration modulation of the pulse wave · 30 s",
    tacho: "RR tachogram", tachoMeta: "beat-to-beat interval in ms · last 2 min · ○ = irregular/artefact",
    poincareMeta: "RR(n) vs RR(n+1) · 5 min", spectrum: "HRV spectrum", spectrumMeta: "LF 0.04–0.15 Hz · HF 0.15–0.4 Hz · 5 min",
    shape: "Pulse shape", shapeNote: "Ensemble average of the last 20 s (top) and its 2nd derivative with a–e waves (bottom). The device pre-filters the wave; use for comparison, not diagnosis.",
    rise: "Rise", notch: "Peak→notch", trends: "Trends", all: "All", time: "Time", pulse: "Pulse", respPerMin: "Resp /min",
    ampPct: "Amplitude %", pulseCaps: "PULSE", respCaps: "RESP", respShort: "Resp", perfCaps: "PERFUSION", relative: "relative",
    meanHr: "Mean HR", amplitude: "Amplitude", rhythm: "Rhythm",
    ampSub: "Amplitude relative to the session median",
    footer: "PlethLab shows data from CMS50D+-compatible pulse oximeters (e.g. PULOX PO-250). Respiration, HRV, rhythm and pulse shape are computed from the pulse wave. Not a medical device, no diagnosis. Limits are rough guide values.",
    connected: "connected", disconnected: "device not connected", user: "User",
    inopDisconnected: "DEVICE DISCONNECTED", inopFinger: "NO FINGER / SENSOR OFF", inopWeak: "WEAK SIGNAL", inopServer: "SERVER UNREACHABLE",
    spo2Low: "▲ SpO₂ LOW", spo2Reduced: "! SpO₂ reduced", normal: "normal", starting: "starting …",
    hrHigh: "! PULSE HIGH", hrLow: "! PULSE LOW", deviceAvg: "device value (averaged)",
    respEst: "estimated from the pulse wave", quality: "quality", good: "good", medium: "medium", uncertain: "uncertain",
    collecting: "collecting data (keep still ≥ 30 s)", last60: "last 60 s", beats: "beats",
    regular: "regular", irregular: "irregular", na: "n/a",
    needData: "needs ≥ 2 min of calm recording", psdSpan: "based on",
    deviceTitle: "Device", close: "Close", readStorage: "Read device storage", setClock: "Set device clock to PC time",
    segment: "Recording", start: "Start", duration: "Duration", download: "Download", downloadCsv: "Download as CSV",
    loading: "Talking to the device …", noSegments: "No recordings stored on the device.",
    storing: "The device is still recording. Stop the recording on the device, then try again.",
    clockOk: "Device clock set to", clockFail: "The device did not confirm the new time.",
    unknownStart: "unknown (clock not set)", minSpo2: "Min SpO₂", meanPulse: "Mean pulse", desat: "Desaturations ≥3 %",
    odi: "per hour", samples: "samples",
  },
  de: {
    subtitle: "Pulsoximeter-Monitor", signal: "Signal", device: "Gerät", table: "Tabelle", csv: "CSV",
    plethMeta: "Pulswelle · 60 Werte/s, als glatte Kurve gezeichnet · 6 s",
    respWave: "Atmung (abgeleitet)", respWaveMeta: "Atemmodulation der Pulswelle · 30 s",
    tacho: "RR-Tachogramm", tachoMeta: "Abstand der Pulsschläge in ms · letzte 2 min · ○ = auffällig/Artefakt",
    poincareMeta: "RR(n) gegen RR(n+1) · 5 min", spectrum: "HRV-Spektrum", spectrumMeta: "LF 0,04–0,15 Hz · HF 0,15–0,4 Hz · 5 min",
    shape: "Pulsform", shapeNote: "Mittelwert der letzten 20 s (oben) und 2. Ableitung mit a–e-Wellen (unten). Das Gerät filtert die Welle vor; zum Vergleichen, nicht zur Diagnose.",
    rise: "Anstieg", notch: "Gipfel→Delle", trends: "Trends", all: "Alles", time: "Zeit", pulse: "Puls", respPerMin: "Atem/min",
    ampPct: "Amplitude %", pulseCaps: "PULS", respCaps: "ATMUNG", respShort: "Atmung", perfCaps: "PERFUSION", relative: "relativ",
    meanHr: "Ø Puls", amplitude: "Amplitude", rhythm: "Rhythmus",
    ampSub: "Amplitude relativ zum Sitzungsmittel",
    footer: "PlethLab zeigt Daten von CMS50D+-kompatiblen Pulsoximetern (z. B. PULOX PO-250). Atmung, HRV, Rhythmus und Pulsform werden aus der Pulswelle berechnet. Kein Medizinprodukt, keine Diagnose. Grenzwerte sind grobe Richtwerte.",
    connected: "verbunden", disconnected: "Gerät nicht verbunden", user: "Benutzer",
    inopDisconnected: "GERÄT GETRENNT", inopFinger: "KEIN FINGER / SENSOR AB", inopWeak: "SCHWACHES SIGNAL", inopServer: "SERVER NICHT ERREICHBAR",
    spo2Low: "▲ SpO₂ NIEDRIG", spo2Reduced: "! SpO₂ erniedrigt", normal: "normal", starting: "Messung läuft an …",
    hrHigh: "! PULS HOCH", hrLow: "! PULS NIEDRIG", deviceAvg: "Gerätewert (gemittelt)",
    respEst: "aus Pulswelle geschätzt", quality: "Qualität", good: "gut", medium: "mittel", uncertain: "unsicher",
    collecting: "sammle Daten (≥ 30 s ruhig halten)", last60: "letzte 60 s", beats: "Schläge",
    regular: "regelmäßig", irregular: "auffällig", na: "n. v.",
    needData: "braucht ≥ 2 min ruhige Messung", psdSpan: "Basis",
    deviceTitle: "Gerät", close: "Schließen", readStorage: "Gerätespeicher lesen", setClock: "Geräteuhr auf PC-Zeit stellen",
    segment: "Aufzeichnung", start: "Start", duration: "Dauer", download: "Herunterladen", downloadCsv: "Als CSV herunterladen",
    loading: "Kommuniziere mit dem Gerät …", noSegments: "Keine Aufzeichnungen im Gerät gespeichert.",
    storing: "Das Gerät zeichnet noch auf. Aufnahme am Gerät beenden und erneut versuchen.",
    clockOk: "Geräteuhr gestellt auf", clockFail: "Das Gerät hat die neue Uhrzeit nicht bestätigt.",
    unknownStart: "unbekannt (Uhr nicht gestellt)", minSpo2: "Min. SpO₂", meanPulse: "Ø Puls", desat: "Entsättigungen ≥3 %",
    odi: "pro Stunde", samples: "Werte",
  },
};
let lang = "en";
try { lang = localStorage.getItem("plethlab-lang") || (navigator.language || "en").slice(0, 2); } catch (e) {}
if (!I18N[lang]) lang = "en";
const t = k => I18N[lang][k] ?? I18N.en[k] ?? k;
function applyLang() {
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll("[data-i18n-prefix]").forEach(el => { el.firstChild.textContent = t(el.dataset.i18nPrefix); });
  $("langBtn").textContent = lang === "en" ? "DE" : "EN";
  updateNumerics(); drawStrips();
}

const $ = id => document.getElementById(id);
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const loc = () => lang === "de" ? "de-DE" : "en-GB";
const fmtT = ts => new Date(ts * 1000).toLocaleTimeString(loc());
const fmt = (v, d = 0) => v == null ? "–" : (+v).toLocaleString(loc(), { minimumFractionDigits: d, maximumFractionDigits: d });

let trend = [], rrList = [], metrics = {}, hl = {}, ps = null, rw = [], status = {}, range = 1800;

// ---------- header ----------
for (let i = 0; i < 8; i++) { const s = document.createElement("span"); s.style.height = (3 + i * 1.6) + "px"; $("sig").appendChild(s); }
function tickClock() { const d = new Date(); $("clock").innerHTML = d.toLocaleTimeString(loc()) + `<small>${d.toLocaleDateString(loc())}</small>`; }
tickClock(); setInterval(tickClock, 500);
$("csvBtn").onclick = () => { location.href = "/api/csv"; };
$("langBtn").onclick = () => { lang = lang === "en" ? "de" : "en"; try { localStorage.setItem("plethlab-lang", lang); } catch (e) {} applyLang(); };

// ---------- canvas helpers ----------
function prep(cv) {
  const dpr = window.devicePixelRatio || 1, r = cv.getBoundingClientRect();
  const w = Math.round(r.width * dpr), h = Math.round(r.height * dpr);
  if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
  const ctx = cv.getContext("2d"); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, r.width, r.height);

  }

    ctx.strokeStyle = "#fff"; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(x(best[0]), y(best[1]), 6, 0, 7); ctx.stroke();

  $("pSpo2").classList.toggle("crit-bg", s.spo2 != null && s.spo2 < 90);
  if (s.pr == null) { setAlarm($("hrAlarm")); $("hrSub").textContent = ""; }
  else if (s.pr > 120 || s.pr < 50) { setAlarm($("hrAlarm"), "warn", s.pr > 120 ? t("hrHigh") : t("hrLow")); $("hrSub").textContent = ""; }
  else { setAlarm($("hrAlarm")); $("hrSub").textContent = t("deviceAvg"); }

  $("resp").textContent = fmt(a.resp, 0);
  $("respSub").textContent = a.resp != null
    ? `${t("respEst")} · ${t("quality")} ${a.resp_q >= .6 ? t("good") : a.resp_q >= .4 ? t("medium") : t("uncertain")}`
    : (s.finger ? t("collecting") : t("respEst"));
  $("rmssd").textContent = fmt(a.rmssd);
  $("sdnn").textContent = fmt(a.sdnn); $("pnn50").textContent = a.pnn50 == null ? "–" : fmt(a.pnn50) + " %";
  $("hrMean").textContent = fmt(a.hr);
  $("hrvSub").textContent = a.n_beats ? `${t("last60")} · ${a.n_beats} ${t("beats")}` : t("last60");
  $("amp").textContent = a.amp_rel == null ? "–" : fmt(a.amp_rel) + " %";
  $("pi").textContent = s.pi != null ? fmt(s.pi / 100, 1) + " %" : t("na");
  if (a.irreg == null) $("rhythm").textContent = "–";
  else if (a.irreg < 5) $("rhythm").textContent = t("regular");
  else $("rhythm").innerHTML = `<span style="color:var(--warn)">! ${fmt(a.irreg)} % ${t("irregular")}</span>`;
}

// ---------- device dialog ----------
function dlgMsg(kind, text) { const m = $("dlgMsg"); m.className = "msg show " + kind; m.textContent = text; }
async function post(url) { const r = await fetch(url, { method: "POST" }); return r.json(); }
$("deviceBtn").onclick = () => $("dlg").showModal();
$("dlgClose").onclick = () => $("dlg").close();
$("loadStorage").onclick = async () => {
  dlgMsg("info", t("loading")); $("recWrap").hidden = true;
  const r = await post("/api/device/storage").catch(e => ({ ok: false, error: String(e) }));
  const tb = $("segTable").querySelector("tbody"); tb.innerHTML = "";
  if (!r.ok) { $("segTable").hidden = true; return dlgMsg("err", r.error); }
  if (!r.segments.length) { $("segTable").hidden = true; return dlgMsg("info", t("noSegments")); }
  $("dlgMsg").className = "msg";
  if (r.storing) dlgMsg("info", t("storing"));
  for (const sg of r.segments) {
    const tr = document.createElement("tr");
    const dur = sg.samples ? `${Math.floor(sg.samples / 60)} min ${sg.samples % 60} s` : "–";
    tr.innerHTML = `<td>${sg.user + 1} / ${sg.segment + 1}</td><td>${sg.start ? new Date(sg.start).toLocaleString(loc()) : t("unknownStart")}</td><td>${dur}</td><td><button>${t("download")}</button></td>`;
    tr.querySelector("button").onclick = () => downloadSeg(sg);
    tb.appendChild(tr);
  }
  $("segTable").hidden = false;
};
async function downloadSeg(sg) {
  dlgMsg("info", t("loading"));
  const r = await post(`/api/device/download?user=${sg.user}&segment=${sg.segment}`).catch(e => ({ ok: false, error: String(e) }));
  if (!r.ok) return dlgMsg("err", r.error === "storing" ? t("storing") : (r.message || r.error));
  $("dlgMsg").className = "msg";
  showRecording(r.samples, sg.start);
  $("recCsv").href = "/api/csv?file=" + encodeURIComponent(r.file);
}
function showRecording(samples, start) {
  $("recWrap").hidden = false;
  const [ctx, W, H] = prep($("recChart"));
  const L = 40, R = 40, T = 8, B = 18, n = samples.length;
  const x = i => L + i / Math.max(1, n - 1) * (W - L - R);
  const sp = samples.map(s => s[0]).filter(v => v != null), pr = samples.map(s => s[1]).filter(v => v != null);
  const loS = Math.min(85, ...sp), ys = v => T + (100 - v) / (100 - loS) * (H - T - B);
  const loP = Math.floor(Math.min(...pr) / 10) * 10 - 10, hiP = Math.ceil(Math.max(...pr) / 10) * 10 + 10;
  const yp = v => T + (hiP - v) / (hiP - loP) * (H - T - B);
  ctx.textBaseline = "middle"; ctx.fillStyle = css("--spo2"); ctx.textAlign = "right";
  ctx.fillText("100", L - 6, ys(100)); ctx.fillText(loS, L - 6, ys(loS));
  ctx.fillStyle = css("--hr"); ctx.textAlign = "left"; ctx.fillText(hiP, W - R + 6, yp(hiP)); ctx.fillText(loP, W - R + 6, yp(loP));
  for (const [idx, col, yy] of [[0, "--spo2", ys], [1, "--hr", yp]]) {
    ctx.strokeStyle = css(col); ctx.lineWidth = 1.5; ctx.beginPath(); let pen = false;
    samples.forEach((s, i) => { const v = s[idx]; if (v == null) { pen = false; return; } if (!pen) { ctx.moveTo(x(i), yy(v)); pen = true; } else ctx.lineTo(x(i), yy(v)); });
    ctx.stroke();
  }
  ctx.fillStyle = css("--muted"); ctx.textAlign = "center"; ctx.textBaseline = "top";
  for (let k = 0; k <= 4; k++) ctx.fillText(Math.round(n * k / 4 / 60) + " min", x(n * k / 4), H - B + 4);
  // desaturation events: drop of >= 3 % below the running 120 s baseline, counted once per event
  let events = 0, inEvent = false;
  for (let i = 0; i < n; i++) {
    const v = samples[i][0]; if (v == null) continue;
    const base = Math.max(...samples.slice(Math.max(0, i - 120), i + 1).map(s => s[0] ?? 0));
    if (!inEvent && base - v >= 3) { events++; inEvent = true; } else if (inEvent && base - v < 1) inEvent = false;
  }
  const hours = n / 3600;
  $("recStats").innerHTML = `<div>${t("minSpo2")}<b>${sp.length ? Math.min(...sp) : "–"} %</b></div>
    <div>${t("meanPulse")}<b>${pr.length ? fmt(pr.reduce((a, b) => a + b, 0) / pr.length) : "–"} bpm</b></div>
    <div>${t("desat")}<b>${events} (${fmt(hours ? events / hours : 0, 1)} ${t("odi")})</b></div>`;
}
$("setClock").onclick = async () => {
  dlgMsg("info", t("loading"));
  const r = await post("/api/device/clock").catch(e => ({ ok: false, error: String(e) }));
  if (r.ok) dlgMsg("ok", `${t("clockOk")} ${new Date(r.set_to).toLocaleString(loc())}`);
  else dlgMsg("err", r.error || `${t("clockFail")} (${(r.acks || []).join(", ")})`);
};

// ---------- data stream ----------
let beatTimer, serverDown = false;
function onMsg(m) {
  serverDown = false;
  for (const v of m.w) { wave[wavePos] = v; wavePos = (wavePos + 1) % WAVE_LEN; }
  if (m.beat) {
    beatMarks.push((wavePos - 1 + WAVE_LEN) % WAVE_LEN);
    $("heart").classList.add("beat"); clearTimeout(beatTimer); beatTimer = setTimeout(() => $("heart").classList.remove("beat"), 140);
  }
  status = m.s;
  if (m.rr && m.rr.length) { rrList.push(...m.rr); const cut = Date.now() / 1000 - 900; rrList = rrList.filter(r => r[0] >= cut); }
  if (m.a) metrics = m.a;
  if (m.rw) rw = m.rw;
  if (m.hl) { hl = m.hl; drawPsd(); drawPoincare(); }
  if ("ps" in m) { ps = m.ps; drawShape(); }
  updateNumerics();
  if (m.t) { trend.push(m.t); drawStrips(); }
}
fetch("/api/history").then(r => r.json()).then(h => {
  trend = h.trend || []; rrList = h.rr || []; metrics = h.a || {}; hl = h.hl || {}; ps = h.ps || null; rw = h.rw || [];
  drawStrips(); drawPsd(); drawPoincare(); drawShape();
}).catch(() => {});
const es = new EventSource("/stream");
es.onmessage = e => onMsg(JSON.parse(e.data));
es.onerror = () => { serverDown = true; updateNumerics(); };

applyLang();
(function loop() { drawPleth(); drawResp(); drawTacho(); requestAnimationFrame(loop); })();
addEventListener("resize", () => { drawStrips(); drawPsd(); drawPoincare(); drawShape(); });
</script>
